name: astrbot_plugin_fat_fish_wallet
display_name: 大肥鱼钱包保卫战
short_desc: 高峰时段自动暂停模型调用，守护钱包
desc: |
  根据模型供应商（默认 DeepSeek）的峰谷计费，在高峰时段（默认 09:00-12:00、
  14:00-18:30）自动暂停所有模型服务，空闲时段自动恢复，从源头省下高峰时段的
  模型调用费用。

  特性：
  - 自动识别当前会话使用的模型供应商，按配置关键词匹配是否拦截，不写死 DeepSeek
  - 高峰拦截只对唤醒/艾特消息提示，群聊闲聊不刷屏
  - 白名单用户/群聊可无视拦截直接使用
  - 时段自动提醒：高峰开始前提醒、高峰结束（12:00/18:30）提醒空闲到来，可指定群聊
  - /峰谷 查询当前时段、供应商、下次切换、今日统计；管理员可手动强制开启(放行)/关闭(拦截)
  - 时段、星期、时区、文案、图片、提醒目标均可配置，全平台通用
version: 1.1.2
author: foxchuqiao
repo: https://github.com/foxchuqiao/astrbot_plugin_fat_fish_wallet
astrbot_version: ">=4.9.2"
